<div hlmCard class="gap-0 overflow-hidden bg-white/[0.02]! py-0">
  <div class="flex items-center justify-between gap-3 border-b border-border/60 px-4 py-3">
    <div class="flex flex-col gap-0.5">
      <span class="font-mono text-[10px] uppercase tracking-[0.18em] text-muted-foreground">
        Visualizador de ruta
      </span>
      <span class="text-sm font-semibold text-foreground">{{ title() }}</span>
    </div>
    <span
      class="rounded-md border border-border/60 bg-white/[0.03] px-2 py-1 font-mono text-[10px] uppercase tracking-[0.14em] text-muted-foreground"
    >
      Leaflet · OSM
    </span>
  </div>

  <div
    #mapElement
    [style.height]="height()"
    class="w-full"
    role="application"
    [attr.aria-label]="ariaLabel()"
  ></div>
</div>
