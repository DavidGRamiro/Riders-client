<div hlmCard class="bg-white/[0.02]! py-0">
  <div hlmCardHeader class="p-4!">
    <div class="flex flex-col gap-4 xl:flex-row xl:items-center xl:justify-between">
      <div class="flex min-w-0 flex-col gap-2">
        <div class="flex flex-wrap items-center gap-3">
          <h2 hlmCardTitle class="text-xl font-bold tracking-tight">
            {{ title() }}
          </h2>
          <span
            class="inline-flex items-center rounded border border-amber-500/30 bg-amber-500/10 px-2 py-1 font-mono text-[10px] uppercase tracking-[0.12em] text-amber-400">
            Óptima Trazada
          </span>
        </div>
        <p class="flex items-center gap-2 text-sm text-muted-foreground">
          <ng-icon name="lucideSignpost" class="size-4 shrink-0" aria-hidden="true" />
          {{ pointsOfRoutes() }}
        </p>
      </div>

      <div class="grid shrink-0 grid-cols-2 gap-2">
        <div class="flex flex-col gap-1 rounded-md border border-border/60 bg-white/[0.02] px-3.5 py-2">
          <span class="font-mono text-[9px] uppercase tracking-[0.16em] text-muted-foreground">
            Distancia
          </span>
          <span class="text-lg font-semibold leading-none text-foreground">
            {{ distance() }}<span class="text-xs font-medium text-muted-foreground ml-1">km</span>
          </span>
        </div>
        <div class="flex flex-col gap-1 rounded-md border border-border/60 bg-white/[0.02] px-3.5 py-2">
          <span class="font-mono text-[9px] uppercase tracking-[0.16em] text-muted-foreground">
            Tiempo
          </span>
          <span class="text-lg font-semibold leading-none text-foreground">{{ time() }} h</span>
        </div>
      </div>
    </div>
  </div>
</div>
