<section class="flex w-full flex-col">
  <!-- Cabecera de página -->
  <div class="mx-auto flex w-full max-w-[1600px] flex-col px-4 sm:px-6 xl:px-8">
    <div class="flex flex-col gap-3 border-b border-border/60 py-3 lg:flex-row lg:items-center lg:justify-between">
      <nav
        aria-label="Migas de pan"
        class="flex flex-wrap items-center gap-2 font-mono text-[10px] uppercase tracking-[0.14em] text-muted-foreground"
      >
        <a routerLink="/home" class="transition-colors hover:text-foreground">RIDERS</a>
        <span aria-hidden="true">/</span>
        <span>Telemetría Central</span>
        <span aria-hidden="true">/</span>
        <span class="text-foreground">Mi Garaje Virtual</span>
      </nav>

      <div class="flex flex-wrap items-center gap-2">
        <span class="inline-flex items-center gap-2 rounded border border-border/60 bg-white/[0.03] px-2.5 py-1.5 font-mono text-[9px] uppercase tracking-[0.14em] text-muted-foreground">
          <span class="size-1.5 rounded-full bg-white" aria-hidden="true"></span>
          {{ 0 }} monturas registradas
        </span>
        <span
          class="inline-flex items-center gap-2 rounded border border-border/60 bg-white/[0.03] px-2.5 py-1.5 font-mono text-[9px] uppercase tracking-[0.14em] text-muted-foreground"
        >
          <ng-icon name="lucideRadio" class="size-3" aria-hidden="true" />
          ECU Sync: Activa
        </span>
        <span
          class="inline-flex items-center gap-2 rounded border border-border/60 bg-white/[0.03] px-2.5 py-1.5 font-mono text-[9px] uppercase tracking-[0.14em] text-muted-foreground"
        >
          <ng-icon name="lucideWifi" class="size-3" aria-hidden="true" />
          Ping 18ms
        </span>
      </div>
    </div>

    <div class="flex flex-col gap-6 pt-8 lg:flex-row lg:items-end lg:justify-between">
      <div class="flex flex-col gap-3">
        <span
          class="inline-flex w-fit items-center rounded border border-border/60 bg-white/[0.03] px-2 py-1 font-mono text-[10px] uppercase tracking-[0.18em] text-muted-foreground"
        >
          SYS://GARAGE_MODULE.64
        </span>
        <h1 class="text-4xl font-bold tracking-tight text-foreground sm:text-5xl xl:text-6xl">
          Mi Garaje Virtual
        </h1>
        <p class="max-w-2xl text-sm leading-relaxed text-muted-foreground sm:text-base">
          Gestión de monturas de alta cilindrada, historial mecánico, telemetría y actividad de
          rodaje en red sincronizada.
        </p>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <button
          type="button"
          class="inline-flex h-11 items-center gap-2 rounded-md border border-border/60 bg-white/[0.03] px-4 text-sm font-medium text-foreground transition-colors hover:bg-white/[0.06] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring/40"
        >
          <ng-icon name="lucideSlidersHorizontal" class="size-4" aria-hidden="true" />
          Filtros Logs
        </button>
        <button
          type="button"
          class="inline-flex h-11 items-center gap-2 rounded-md bg-white px-4 text-sm font-semibold text-zinc-900 transition-colors hover:bg-zinc-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/50"
        >
          <ng-icon name="lucidePlus" class="size-4" aria-hidden="true" />
          Registrar Nueva Moto
        </button>
      </div>
    </div>
  </div>

  <!-- Navegación por tabs internos -->
  <div class="mt-8 border-y border-border/60 bg-white/[0.02]">
    <div class="mx-auto w-full max-w-[1600px] px-4 sm:px-6 xl:px-8">
      <nav aria-label="Secciones del garaje"class="-mx-2 flex items-center gap-1 overflow-x-auto px-2 py-2">
        @for (tab of tabs; track tab.id) {
          <button
            type="button"
            [attr.aria-current]="selectedTab() === tab.id ? 'page' : null"
            [class]="
              selectedTab() === tab.id
                ? 'inline-flex h-11 shrink-0 items-center gap-2 rounded-md border border-border/70 bg-white/[0.06] px-3 text-sm font-medium text-foreground'
                : 'inline-flex h-11 shrink-0 items-center gap-2 rounded-md border border-transparent px-3 text-sm font-medium text-muted-foreground transition-colors hover:bg-white/[0.04] hover:text-foreground'
            "
            (click)="selectTab(tab)"
          >
            <ng-icon [name]="tab.icon" class="size-4" aria-hidden="true" />
            {{ tab.label }}
            @if (tab.count) {
              <span class="rounded bg-white/[0.08] px-1.5 py-0.5 font-mono text-[10px] tabular-nums text-muted-foreground">
                {{ tab.count }}
              </span>
            }
          </button>
        }
      </nav>
    </div>
  </div>


  <div class="mx-auto grid w-full max-w-[1600px] grid-cols-1 gap-6 px-4 py-6 sm:px-6 xl:grid-cols-[minmax(0,1.95fr)_minmax(0,1fr)] xl:items-start xl:px-8">
    <div class="flex min-w-0 flex-col gap-8">
      <!-- Componente para listar las motos del usuario -->
      <div id="garage-bikes" class="scroll-mt-24 overflow-hidden rounded-lg border border-border/60 bg-card">
        <app-user-bikes />
      </div>

      <!-- Rutas creadas por el usuario -->
      <div id="garage-created" aria-labelledby="garage-created-title" class="scroll-mt-24 flex flex-col gap-4">
        <app-user-routes-summary />
      </div>

      <!-- Eventos y kedadas -->
      <section id="garage-events" aria-labelledby="garage-events-title" class="scroll-mt-24 flex flex-col gap-4">
        <app-user-events-summary />
      </section>
    </div>

    <!-- Formulario para registrar nueva moto -->
    <aside class="flex min-w-0 flex-col gap-6">
      <app-user-bike-form />
    </aside>
  </div>
</section>
