
<form [formRoot]="loginForm">

  <div class="flex flex-col w-100 gap-2">
    <button hlmBtn variant="outline" class="cursor-pointer">
      <ng-icon name="faBrandApple"></ng-icon>
      Continuar con Apple
    </button>
    <button hlmBtn variant="outline" class="cursor-pointer">
        <ng-icon name="faBrandGoogle"></ng-icon>
        Continuar con Google
    </button>
  
    <p class="text-gray-300 text-center mt-4">O continúa con Email</p>
    <hlm-separator />
    
    <!-- EMAIL -->
    <div class="flex flex-col mt-4 gap-4 w-full">
      <hlm-input-group>
        <input hlmInputGroupInput type="username" placeholder="Introduzca el nombre de usuario" [formField]="loginForm.username" />
        <hlm-input-group-addon align="inline-end">
          <ng-icon name="lucideMail" />
        </hlm-input-group-addon>
      </hlm-input-group>
  
    <!-- PASSWORD -->
      <hlm-input-group>
        <input hlmInputGroupInput [type]="passwordType()" placeholder="Contraseña" [formField]="loginForm.password" />
        <hlm-input-group-addon align="inline-end">
          <button hlmInputGroupButton  title="password" (click)="showPassword()" size="icon-xs">
            <ng-icon [name]="isVisible()"></ng-icon>
          </button>
        </hlm-input-group-addon>
      </hlm-input-group>
    </div>
  
    <!-- REMEBER USER -->
    <div class="flex mt-2 gap-2 items-center">
      <hlm-checkbox inputId="remember" />
      <label hlmLabel for="remember">Recordar en este equipo</label>
    </div>
  
    <!-- CTA -->
    <div class="flex mt-4 justify-center">
      <button type="submit" class="w-50 cursor-pointer bg-amber-200" hlmBtn variant="default">
        Entrar al garage
        <ng-icon name="faSolidArrowRight" />
      </button>
    </div>
  </div>
</form>
